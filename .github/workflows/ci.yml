name: Agentvora validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e apps/api -e vendor/TradingAgents
      - run: python -m alembic -c apps/api/alembic.ini upgrade head
      - run: python -m compileall -q apps/api/agentvora
      - run: python -m pytest apps/api/tests -q
      - run: npm ci --prefix apps/web
      - run: npm run typecheck --prefix apps/web
      - run: npm run test --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e --prefix apps/web
      - run: python scripts/build_source_package.py
      - run: cp .env.example .env && docker compose build
