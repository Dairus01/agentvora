[project]
name = "agentvora-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "sqlalchemy>=2.0", "alembic>=1.14", "pydantic-settings>=2.7", "apscheduler>=3.11,<4", "httpx>=0.28", "pandas>=3.0.6", "numpy>=2.0", "yfinance>=1.7.0", "ccxt>=4.4", "psycopg[binary]>=3.2", "websockets>=14", "feedparser>=6.0", "exchange-calendars>=4.9"]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["agentvora*"]
[tool.setuptools.package-data]
agentvora = ["catalog.json"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
